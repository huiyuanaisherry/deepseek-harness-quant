<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型与 API · Deepseek HARNESS Quant</title>
<link rel="stylesheet" href="/v2/assets/ui_common.css"><link rel="stylesheet" href="/v2/assets/app.css">
<style>
.settings{max-width:960px;margin:40px auto;padding:0 24px 60px;color:#e4e4e7}.settings header{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:32px}.eyebrow{color:#a1a1aa;font-size:11px;letter-spacing:2px}h1{font-size:30px;letter-spacing:-1px;margin:10px 0}p,.hint{color:#a1a1aa;font-size:13px;line-height:1.8}.panel{border-top:1px solid #303038;padding:24px 0}h2{font-size:16px;margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:flex;flex-direction:column;gap:8px;font-size:13px;margin-bottom:18px}input,select,textarea{width:100%;box-sizing:border-box;background:#111114;color:#e4e4e7;border:1px solid #3a3a44;border-radius:6px;padding:11px;font:inherit}input:focus,select:focus,textarea:focus{outline:2px solid #5e6ad2;outline-offset:1px}button{background:#25252d;color:#e4e4e7;border:1px solid #3a3a44;border-radius:6px;padding:10px 16px;cursor:pointer}button.primary{background:#5e6ad2;border-color:#5e6ad2}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap}.status{padding:16px;border-left:3px solid #5e6ad2;background:#191921;line-height:1.8;white-space:pre-wrap}.status.error{border-color:#ef7272;color:#ffb4b4}#destination{overflow-wrap:anywhere}#custom-fields[hidden]{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.settings{margin:24px auto;padding:0 16px}body{padding-left:0!important}#sidebar{display:none}}
</style></head><body><div id="sidebar"></div><main class="settings"><header><div><div class="eyebrow">WORKSPACE / MODEL SETTINGS</div><h1>模型与 API</h1><p>凭据由 DSH 管理。配置保存与模型请求分开，不自动发现模型或发起付费测试。</p></div><button id="logout" type="button">退出登录</button></header>
<div id="status" class="status" role="status" aria-live="polite">正在加载目录…</div>
<form id="settings-form" class="panel"><h2>01 / 服务商与凭据</h2><label class="field" for="provider">服务商<select id="provider" aria-label="服务商"></select></label>
<div id="custom-fields"><div class="grid"><label class="field" for="provider-id">服务商 ID<input id="provider-id" aria-label="服务商 ID" placeholder="my-provider" pattern="[a-z][a-z0-9-]{0,63}"></label><label class="field" for="display-name">显示名称<input id="display-name" aria-label="显示名称" maxlength="256"></label></div><label class="field" for="protocol">协议<select id="protocol" aria-label="协议"></select></label><label class="field" for="endpoint">HTTPS API 地址<input id="endpoint" aria-label="HTTPS API 地址" type="url" placeholder="https://api.example.com/v1"></label><label class="field" for="models">模型 ID（每行一个）<textarea id="models" aria-label="模型 ID（每行一个）" rows="3" placeholder="填写服务商提供的精确模型 ID"></textarea></label></div>
<p id="destination"></p><label class="field" for="key">API Key<input id="key" aria-label="API Key" type="password" autocomplete="new-password" spellcheck="false" placeholder="留空保留已有 Key"></label><p id="credential-state"></p><p class="hint">Key 不会回显。只读或环境变量来源请在运行环境管理；移除 Key 不会删除服务商。</p><div class="actions"><button type="submit" class="primary">保存配置 / Key</button><button id="remove-key" type="button" disabled>移除 Key</button><button id="refresh" type="button">刷新目录</button></div></form>
<section class="panel"><h2>02 / 新会话默认模型</h2><p id="current-default"></p><label class="field" for="model">当前服务商模型<select id="model" aria-label="当前服务商模型"></select></label><p id="model-hint"></p><p>已有会话保留原来的服务商与模型，不会自动切换。</p><button id="set-default" class="primary" type="button" disabled>设为新会话默认</button></section></main>
<script src="/v2/core/api.js"></script><script src="/v2/components/icons.js"></script><script src="/v2/components/sidebar.js"></script><script>LW.sidebar.render('sidebar',{active:'settings'});</script><script src="/v2/assets/model-settings.js"></script></body></html>
